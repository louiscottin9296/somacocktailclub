    <!-- Google tag (gtag.js): Analytics + Ads, only loaded after cookie consent -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied'
      });

      window.loadGoogleTags = function () {
        if (window.googleTagsLoaded) return;
        window.googleTagsLoaded = true;
        gtag('consent', 'update', {
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted',
          analytics_storage: 'granted'
        });
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YFS1W6D3ZF';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-YFS1W6D3ZF');
        gtag('config', 'AW-18459613326');
      };

      // Contact link click tracking (email / WhatsApp / phone / Instagram) — one listener for every page and language.
      // Events wait in the dataLayer and are only sent if the visitor has accepted cookies.
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '';
        var h = href.trim().toLowerCase();
        var name = null;
        if (h.indexOf('mailto:') === 0) name = 'email_click';
        else if (/^https?:\/\/(www\.)?(wa\.me|api\.whatsapp\.com)(\/|$)/.test(h) || h.indexOf('whatsapp://') === 0) name = 'whatsapp_click';
        else if (h.indexOf('tel:') === 0) name = 'phone_click';
        else if (/^https?:\/\/([a-z0-9-]+\.)?(instagram\.com|instagr\.am)(\/|$)/.test(h)) name = 'instagram_click';
        if (!name) return;
        gtag('event', name, { link_url: href, transport_type: 'beacon' });
        if (location.hostname === 'localhost') console.log('[GA4 event]', name, href);
      }, true);

      try {
        if (localStorage.getItem('soma-cookie-consent') === 'granted') window.loadGoogleTags();
      } catch (e) {}
    </script>
